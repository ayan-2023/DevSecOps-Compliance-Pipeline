<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="secGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="gateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>
    <linearGradient id="deployGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="1100" height="800" fill="url(#bgGrad)" rx="16" />

  <!-- Header -->
  <text x="50" y="50" fill="#38bdf8" font-family="Segoe UI, Roboto, sans-serif" font-size="24" font-weight="bold">DevSecOps Compliance Pipeline for Terraform</text>
  <text x="50" y="80" fill="#94a3b8" font-family="Segoe UI, Roboto, sans-serif" font-size="14">Enterprise Multi-Stage Architecture: Azure DevOps YAML + External Template Repository</text>

  <!-- Stage 1: Security Tools -->
  <rect x="50" y="110" width="1000" height="150" fill="url(#secGrad)" rx="12" stroke="#6366f1" stroke-width="1.5" filter="url(#shadow)" />
  <text x="75" y="140" fill="#c7d2fe" font-family="Segoe UI, Roboto, sans-serif" font-size="16" font-weight="bold">Stage 1: Independent Security Scans (External: Mausam/company-pipeline-templates)</text>

  <!-- Security Boxes -->
  <g transform="translate(75, 160)">
    <rect x="0" y="0" width="170" height="75" fill="#1e293b" rx="8" stroke="#818cf8" stroke-width="1" />
    <text x="15" y="30" fill="#fff" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold">TFLint</text>
    <text x="15" y="50" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11">Terraform Ruleset &amp; Lint</text>
    <text x="15" y="65" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="10">Param: Tflint (bool)</text>

    <rect x="190" y="0" width="170" height="75" fill="#1e293b" rx="8" stroke="#818cf8" stroke-width="1" />
    <text x="205" y="30" fill="#fff" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold">TFSec</text>
    <text x="205" y="50" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11">IaC Static Security</text>
    <text x="205" y="65" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="10">Param: TFsec (bool)</text>

    <rect x="380" y="0" width="170" height="75" fill="#1e293b" rx="8" stroke="#818cf8" stroke-width="1" />
    <text x="395" y="30" fill="#fff" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold">Checkov</text>
    <text x="395" y="50" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11">Compliance &amp; Policy</text>
    <text x="395" y="65" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="10">Param: Checkov (bool)</text>

    <rect x="570" y="0" width="170" height="75" fill="#1e293b" rx="8" stroke="#818cf8" stroke-width="1" />
    <text x="585" y="30" fill="#fff" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold">Trivy</text>
    <text x="585" y="50" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11">Misconfiguration Scan</text>
    <text x="585" y="65" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="10">Param: Trivy (bool)</text>

    <rect x="760" y="0" width="180" height="75" fill="#1e293b" rx="8" stroke="#818cf8" stroke-width="1" />
    <text x="775" y="30" fill="#fff" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold">Gitleaks</text>
    <text x="775" y="50" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11">Secret Leak Detection</text>
    <text x="775" y="65" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="10">Param: Gitleaks (bool)</text>
  </g>

  <!-- Arrow down -->
  <line x1="550" y1="260" x2="550" y2="300" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4" />
  <polygon points="545,295 550,305 555,295" fill="#38bdf8" />
  <text x="560" y="285" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11">Compile-Time dependsOn (Only Active Scans)</text>

  <!-- Stage 2: Terraform Init & Validate -->
  <rect x="150" y="305" width="800" height="100" fill="url(#cardGrad)" rx="12" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)" />
  <text x="180" y="335" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="16" font-weight="bold">Stage 2: Terraform Init &amp; Validate (Pool: Mausam agent)</text>
  <text x="180" y="360" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="13">• TerraformTask@5 Init: Azure Blob Storage Backend (Mausam-variable-group)</text>
  <text x="180" y="380" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="13">• TerraformTask@5 Validate: Configuration Syntax &amp; Internal Reference Consistency</text>

  <!-- Arrow down -->
  <line x1="550" y1="405" x2="550" y2="445" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4" />
  <polygon points="545,440 550,450 555,440" fill="#38bdf8" />

  <!-- Stage 3: Terraform Plan & Artifact -->
  <rect x="150" y="450" width="800" height="110" fill="url(#cardGrad)" rx="12" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)" />
  <text x="180" y="480" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="16" font-weight="bold">Stage 3: Terraform Plan &amp; Artifact Publication</text>
  <text x="180" y="505" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="13">• TerraformTask@5 Plan: -out=$(workingDirectory)/tfplan using Service Connection</text>
  <text x="180" y="525" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="13">• PublishPipelineArtifact@1: Publishes immutable artifact 'terraform-plan'</text>
  <text x="180" y="545" fill="#a5f3fc" font-family="Segoe UI, sans-serif" font-size="12">Execution plan frozen for production approval</text>

  <!-- Arrow down -->
  <line x1="550" y1="560" x2="550" y2="600" stroke="#f97316" stroke-width="2" stroke-dasharray="4" />
  <polygon points="545,595 550,605 555,595" fill="#f97316" />

  <!-- Stage 4: Approval & Apply -->
  <g transform="translate(50, 605)">
    <!-- Gate Box -->
    <rect x="0" y="0" width="480" height="150" fill="url(#gateGrad)" rx="12" stroke="#f97316" stroke-width="1.5" filter="url(#shadow)" />
    <text x="25" y="30" fill="#ffedd5" font-family="Segoe UI, sans-serif" font-size="16" font-weight="bold">Stage 4 (Job 1): Manual Approval Gate</text>
    <text x="25" y="55" fill="#fed7aa" font-family="Segoe UI, sans-serif" font-size="13">• Pool: Server (Agentless server job)</text>
    <text x="25" y="75" fill="#fed7aa" font-family="Segoe UI, sans-serif" font-size="13">• Task: ManualValidation@1</text>
    <text x="25" y="95" fill="#fed7aa" font-family="Segoe UI, sans-serif" font-size="13">• Notify: ayanjana2026@gmail.com</text>
    <text x="25" y="115" fill="#fed7aa" font-family="Segoe UI, sans-serif" font-size="13">• Condition: main branch &amp; plan succeeded</text>
    <text x="25" y="135" fill="#fed7aa" font-family="Segoe UI, sans-serif" font-size="12">Timeout: 1440 min (Auto-reject on timeout)</text>

    <!-- Arrow between Gate and Apply -->
    <line x1="480" y1="75" x2="520" y2="75" stroke="#10b981" stroke-width="3" />
    <polygon points="515,70 525,75 515,80" fill="#10b981" />

    <!-- Apply Box -->
    <rect x="520" y="0" width="480" height="150" fill="url(#deployGrad)" rx="12" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)" />
    <text x="545" y="30" fill="#d1fae5" font-family="Segoe UI, sans-serif" font-size="16" font-weight="bold">Stage 4 (Job 2): Terraform Apply</text>
    <text x="545" y="55" fill="#a7f3d0" font-family="Segoe UI, sans-serif" font-size="13">• DependsOn: manualApproval (Condition: Succeeded)</text>
    <text x="545" y="75" fill="#a7f3d0" font-family="Segoe UI, sans-serif" font-size="13">• Pool: Mausam agent</text>
    <text x="545" y="95" fill="#a7f3d0" font-family="Segoe UI, sans-serif" font-size="13">• DownloadPipelineArtifact@2: terraform-plan</text>
    <text x="545" y="115" fill="#a7f3d0" font-family="Segoe UI, sans-serif" font-size="13">• TerraformTask@5 Apply: Executes downloaded tfplan</text>
    <text x="545" y="135" fill="#6ee7b7" font-family="Segoe UI, sans-serif" font-size="12">Target: Azure Resource Group &amp; Storage Account</text>
  </g>
</svg>
